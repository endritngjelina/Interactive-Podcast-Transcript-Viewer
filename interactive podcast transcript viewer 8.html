<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Podcast Transcript Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            min-height: 100vh;
        }

        .main-content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .audio-player {
            padding: 25px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .player-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .play-pause-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }

        .play-pause-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
        }

        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: #4f46e5;
        }

        .progress-container {
            flex: 1;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border-radius: 4px;
            transition: width 0.1s ease;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 12px;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .speed-control, .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .speed-select, .volume-slider {
            padding: 5px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
        }

        .transcript-section {
            padding: 30px;
        }

        .search-container {
            position: relative;
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .search-input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }

        .transcript-content {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
            scrollbar-width: thin;
            scrollbar-color: #4f46e5 #f1f5f9;
        }

        .transcript-content::-webkit-scrollbar {
            width: 8px;
        }

        .transcript-content::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }

        .transcript-content::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 4px;
        }

        .transcript-segment {
            display: flex;
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .transcript-segment:hover {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.05), rgba(124, 58, 237, 0.05));
            border-left-color: #4f46e5;
            transform: translateX(5px);
        }

        .timestamp {
            min-width: 80px;
            font-family: 'Courier New', monospace;
            color: #4f46e5;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }

        .speaker {
            min-width: 100px;
            font-weight: 600;
            color: #7c3aed;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }

        .text {
            flex: 1;
            color: #374151;
            font-size: 1rem;
            line-height: 1.7;
        }

        .current-segment {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(124, 58, 237, 0.1));
            border-left: 4px solid #4f46e5;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.2);
            transform: translateX(5px);
        }

        .highlight {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 600;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .sidebar-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .panel-header {
            background: linear-gradient(135deg, #1f2937, #374151);
            color: white;
            padding: 20px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .panel-content {
            padding: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-card {
            text-align: center;
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: #4f46e5;
            transform: translateY(-2px);
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #4f46e5;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chapter-list {
            list-style: none;
        }

        .chapter-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            margin-bottom: 8px;
        }

        .chapter-item:hover {
            background: #f8fafc;
            border-left-color: #4f46e5;
            transform: translateX(5px);
        }

        .chapter-time {
            font-family: 'Courier New', monospace;
            color: #4f46e5;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .chapter-title {
            font-weight: 500;
            color: #374151;
            margin-top: 4px;
        }

        .export-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .waveform {
            height: 60px;
            background: #f8fafc;
            border-radius: 8px;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: end;
            padding: 5px;
            gap: 2px;
        }

        .waveform-bar {
            flex: 1;
            background: #4f46e5;
            border-radius: 2px;
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        .waveform-bar.active {
            opacity: 1;
            background: #7c3aed;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .player-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .transcript-segment {
                flex-direction: column;
                gap: 8px;
            }
            
            .timestamp, .speaker {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="header">
                <h1>🎧 Interactive Podcast Viewer</h1>
                <p>Professional transcript viewer with advanced features</p>
            </div>

            <div class="audio-player">
                <div class="player-container">
                    <button class="play-pause-btn" id="playPauseBtn">▶️</button>
                    <div class="time-display" id="timeDisplay">00:00 / 45:30</div>
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>
                
                <div class="controls">
                    <div class="speed-control">
                        <label>Speed:</label>
                        <select class="speed-select" id="speedSelect">
                            <option value="0.5">0.5x</option>
                            <option value="0.75">0.75x</option>
                            <option value="1" selected>1x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2x</option>
                        </select>
                    </div>
                    
                    <div class="volume-control">
                        <label>🔊</label>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
                    </div>
                </div>

                <div class="waveform" id="waveform"></div>
            </div>

            <div class="transcript-section">
                <div class="search-container">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search transcript...">
                    <span class="search-icon">🔍</span>
                </div>

                <div class="transcript-content" id="transcriptContent">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-panel">
                <div class="panel-header">📊 Statistics</div>
                <div class="panel-content">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <span class="stat-number" id="durationStat">45:30</span>
                            <span class="stat-label">Duration</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-number" id="wordsStat">6,847</span>
                            <span class="stat-label">Words</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-number" id="speakersStat">3</span>
                            <span class="stat-label">Speakers</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-number" id="segmentsStat">127</span>
                            <span class="stat-label">Segments</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar-panel">
                <div class="panel-header">📚 Chapters</div>
                <div class="panel-content">
                    <ul class="chapter-list" id="chapterList"></ul>
                </div>
            </div>

            <div class="sidebar-panel">
                <div class="panel-header">🔧 Export Options</div>
                <div class="panel-content">
                    <button class="export-btn" onclick="exportTranscript('txt')">Export as TXT</button>
                    <button class="export-btn" onclick="exportTranscript('srt')">Export as SRT</button>
                    <button class="export-btn" onclick="exportTranscript('vtt')">Export as VTT</button>
                    <button class="export-btn" onclick="exportTranscript('pdf')">Export as PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Professional-grade Podcast Transcript Viewer
        class PodcastTranscriptViewer {
            constructor() {
                this.currentTime = 0;
                this.duration = 2730; // 45:30 in seconds
                this.isPlaying = false;
                this.playbackSpeed = 1;
                this.volume = 0.8;
                this.currentSegmentIndex = -1;
                this.searchQuery = '';
                
                this.transcriptData = this.generateSampleTranscript();
                this.chapters = this.generateChapters();
                
                this.initializeElements();
                this.bindEvents();
                this.renderTranscript();
                this.renderChapters();
                this.generateWaveform();
                this.updateStats();
                
                // Simulate audio playback
                this.startTimeUpdate();
            }

            generateSampleTranscript() {
                const speakers = ['HOST', 'GUEST', 'CO-HOST'];
                const topics = [
                    'artificial intelligence and machine learning',
                    'the future of cloud computing',
                    'sustainable technology practices',
                    'digital transformation in enterprise',
                    'cybersecurity best practices',
                    'data privacy and ethics',
                    'emerging tech trends',
                    'developer productivity tools'
                ];
                
                const transcript = [];
                let currentTime = 0;
                
                for (let i = 0; i < 127; i++) {
                    const speaker = speakers[Math.floor(Math.random() * speakers.length)];
                    const topic = topics[Math.floor(Math.random() * topics.length)];
                    const duration = Math.random() * 25 + 5; // 5-30 seconds
                    
                    const texts = [
                        `Let's dive deeper into ${topic} and explore how it's reshaping the industry landscape.`,
                        `From my experience working with ${topic}, I've seen tremendous potential for innovation.`,
                        `The key challenge with ${topic} is balancing performance with security considerations.`,
                        `When we look at ${topic}, we need to consider both the technical and business implications.`,
                        `I think ${topic} represents one of the most significant opportunities in our field today.`,
                        `The implementation of ${topic} requires careful planning and cross-functional collaboration.`,
                        `What excites me most about ${topic} is its potential to solve real-world problems at scale.`,
                        `We've been investing heavily in ${topic} and the results have exceeded our expectations.`
                    ];
                    
                    transcript.push({
                        startTime: Math.floor(currentTime),
                        speaker: speaker,
                        text: texts[Math.floor(Math.random() * texts.length)]
                    });
                    
                    currentTime += duration;
                }
                
                return transcript;
            }

            generateChapters() {
                return [
                    { time: 0, title: 'Introduction & Welcome' },
                    { time: 360, title: 'AI & Machine Learning Trends' },
                    { time: 720, title: 'Cloud Computing Evolution' },
                    { time: 1080, title: 'Sustainability in Tech' },
                    { time: 1440, title: 'Digital Transformation' },
                    { time: 1800, title: 'Cybersecurity Focus' },
                    { time: 2160, title: 'Future Predictions' },
                    { time: 2520, title: 'Q&A and Closing' }
                ];
            }

            initializeElements() {
                this.playPauseBtn = document.getElementById('playPauseBtn');
                this.timeDisplay = document.getElementById('timeDisplay');
                this.progressContainer = document.getElementById('progressContainer');
                this.progressBar = document.getElementById('progressBar');
                this.speedSelect = document.getElementById('speedSelect');
                this.volumeSlider = document.getElementById('volumeSlider');
                this.searchInput = document.getElementById('searchInput');
                this.transcriptContent = document.getElementById('transcriptContent');
                this.chapterList = document.getElementById('chapterList');
                this.waveform = document.getElementById('waveform');
            }

            bindEvents() {
                this.playPauseBtn.addEventListener('click', () => this.togglePlayPause());
                this.progressContainer.addEventListener('click', (e) => this.seekTo(e));
                this.speedSelect.addEventListener('change', (e) => this.changeSpeed(e.target.value));
                this.volumeSlider.addEventListener('input', (e) => this.changeVolume(e.target.value));
                this.searchInput.addEventListener('input', (e) => this.searchTranscript(e.target.value));
                
                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        switch(e.code) {
                            case 'Space':
                                e.preventDefault();
                                this.togglePlayPause();
                                break;
                            case 'ArrowRight':
                                this.seekRelative(10);
                                break;
                            case 'ArrowLeft':
                                this.seekRelative(-10);
                                break;
                        }
                    }
                });
            }

            togglePlayPause() {
                this.isPlaying = !this.isPlaying;
                this.playPauseBtn.textContent = this.isPlaying ? '⏸️' : '▶️';
                this.playPauseBtn.style.transform = this.isPlaying ? 'scale(0.95)' : 'scale(1)';
            }

            seekTo(e) {
                const rect = this.progressContainer.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                this.currentTime = percent * this.duration;
                this.updateProgress();
                this.updateCurrentSegment();
            }

            seekRelative(seconds) {
                this.currentTime = Math.max(0, Math.min(this.duration, this.currentTime + seconds));
                this.updateProgress();
                this.updateCurrentSegment();
            }

            changeSpeed(speed) {
                this.playbackSpeed = parseFloat(speed);
            }

            changeVolume(volume) {
                this.volume = volume / 100;
            }

            searchTranscript(query) {
                this.searchQuery = query.toLowerCase();
                this.renderTranscript();
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            renderTranscript() {
                const filteredTranscript = this.transcriptData.filter(segment =>
                    segment.text.toLowerCase().includes(this.searchQuery) ||
                    segment.speaker.toLowerCase().includes(this.searchQuery)
                );

                const html = filteredTranscript.map((segment, index) => {
                    let text = segment.text;
                    if (this.searchQuery) {
                        const regex = new RegExp(`(${this.searchQuery})`, 'gi');
                        text = text.replace(regex, '<span class="highlight">$1</span>');
                    }

                    const isCurrentSegment = this.currentTime >= segment.startTime && 
                                           (index === filteredTranscript.length - 1 || 
                                            this.currentTime < filteredTranscript[index + 1]?.startTime);

                    return `
                        <div class="transcript-segment ${isCurrentSegment ? 'current-segment' : ''}" 
                             data-time="${segment.startTime}" onclick="viewer.jumpToTime(${segment.startTime})">
                            <div class="timestamp">${this.formatTime(segment.startTime)}</div>
                            <div class="speaker">${segment.speaker}</div>
                            <div class="text">${text}</div>
                        </div>
                    `;
                }).join('');

                this.transcriptContent.innerHTML = html;
            }

            renderChapters() {
                const html = this.chapters.map(chapter => `
                    <li class="chapter-item" onclick="viewer.jumpToTime(${chapter.time})">
                        <div class="chapter-time">${this.formatTime(chapter.time)}</div>
                        <div class="chapter-title">${chapter.title}</div>
                    </li>
                `).join('');

                this.chapterList.innerHTML = html;
            }

            generateWaveform() {
                const bars = 150;
                const waveformHTML = Array.from({length: bars}, (_, i) => {
                    const height = Math.random() * 40 + 10;
                    return `<div class="waveform-bar" style="height: ${height}px"></div>`;
                }).join('');
                
                this.waveform.innerHTML = waveformHTML;
            }

            updateWaveform() {
                const bars = this.waveform.children;
                const progress = this.currentTime / this.duration;
                const activeBarCount = Math.floor(progress * bars.length);
                
                Array.from(bars).forEach((bar, index) => {
                    bar.classList.toggle('active', index <= activeBarCount);
                });
            }

            jumpToTime(time) {
                this.currentTime = time;
                this.updateProgress();
                this.updateCurrentSegment();
            }

            updateProgress() {
                const percent = (this.currentTime / this.duration) * 100;
                this.progressBar.style.width = `${percent}%`;
                this.timeDisplay.textContent = `${this.formatTime(this.currentTime)} / ${this.formatTime(this.duration)}`;
                this.updateWaveform();
            }

            updateCurrentSegment() {
                const currentSegment = this.transcriptContent.querySelector('.current-segment');
                if (currentSegment) {
                    currentSegment.classList.remove('current-segment');
                }

                const segments = this.transcriptContent.querySelectorAll('.transcript-segment');
                segments.forEach(segment => {
                    const segmentTime = parseInt(segment.dataset.time);
                    if (this.currentTime >= segmentTime) {
                        const nextSegment = segment.nextElementSibling;
                        if (!nextSegment || this.currentTime < parseInt(nextSegment.dataset.time)) {
                            segment.classList.add('current-segment');
                            segment.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                });
            }

            updateStats() {
                const totalWords = this.transcriptData.reduce((sum, segment) => 
                    sum + segment.text.split(' ').length, 0);
                
                const speakers = [...new Set(this.transcriptData.map(s => s.speaker))];
                
                document.getElementById('wordsStat').textContent = totalWords.toLocaleString();
                document.getElementById('speakersStat').textContent = speakers.length;
                document.getElementById('segmentsStat').textContent = this.transcriptData.length;
            }

            startTimeUpdate() {
                setInterval(() => {
                    if (this.isPlaying) {
                        this.currentTime += this.playbackSpeed * 0.1;
                        if (this.currentTime >= this.duration) {
                            this.currentTime = this.duration;
                            this.isPlaying = false;
                            this.playPauseBtn.textContent = '▶️';
                        }
                        this.updateProgress();
                        this.updateCurrentSegment();
                    }
                }, 100);
            }
        }

        // Export functions
        function exportTranscript(format) {
            const data = viewer.transcriptData;
            let content = '';
            let filename = '';
            let mimeType = '';

            switch(format) {
                case 'txt':
                    content = data.map(segment => 
                        `[${viewer.formatTime(segment.startTime)}] ${segment.speaker}: ${segment.text}`
                    ).join('\n\n');
                    filename = 'transcript.txt';
                    mimeType = 'text/plain';
                    break;
                    
                case 'srt':
                    content = data.map((segment, index) => {
                        const startTime = viewer.formatTime(segment.startTime).replace(':', ',');
                        const endTime = index < data.length - 1 ? 
                            viewer.formatTime(data[index + 1].startTime).replace(':', ',') :
                            viewer.formatTime(viewer.duration).replace(':', ',');
                        
                        return `${index + 1}\n00:${startTime},000 --> 00:${endTime},000\n${segment.speaker}: ${segment.text}\n`;
                    }).join('\n');
                    filename = 'transcript.srt';
                    mimeType = 'text/plain';
                    break;
                    
                case 'vtt':
                    content = 'WEBVTT\n\n' + data.map(segment => {
                        const startTime = '00:' + viewer.formatTime(segment.startTime);
                        return `${startTime}.000 --> ${startTime}.000\n<v ${segment.speaker}>${segment.text}\n`;
                    }).join('\n');
                    filename = 'transcript.vtt';
                    mimeType = 'text/vtt';
                    break;
                    
                case 'pdf':
                    // For demo purposes, we'll create a simple text version
                    content = `PODCAST TRANSCRIPT EXPORT\n\nDuration: ${viewer.formatTime(viewer.duration)}\nTotal Segments: ${data.length}\nSpeakers: ${[...new Set(data.map(s => s.speaker))].join(', ')}\n\n` +
                        data.map(segment => 
                            `[${viewer.formatTime(segment.startTime)}] ${segment.speaker}: ${segment.text}`
                        ).join('\n\n');
                    filename = 'transcript.pdf';
                    mimeType = 'text/plain';
                    break;
            }

            // Create and download file
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // Show success feedback
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '✓ Downloaded!';
            btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
            }, 2000);
        }

        // Advanced Features Class
        class AdvancedFeatures {
            constructor(viewer) {
                this.viewer = viewer;
                this.bookmarks = [];
                this.notes = {};
                this.analytics = {
                    playCount: 0,
                    totalListenTime: 0,
                    segmentViews: {}
                };
                
                this.initializeAdvancedFeatures();
            }

            initializeAdvancedFeatures() {
                this.addKeyboardShortcuts();
                this.addBookmarkFeature();
                this.addNotesFeature();
                this.addAnalytics();
                this.addAccessibilityFeatures();
            }

            addKeyboardShortcuts() {
                const shortcuts = {
                    'KeyK': () => this.viewer.togglePlayPause(),
                    'KeyM': () => this.toggleMute(),
                    'KeyF': () => this.toggleFullscreen(),
                    'KeyB': () => this.addBookmark(),
                    'KeyN': () => this.toggleNotesPanel(),
                    'Comma': () => this.viewer.changeSpeed(Math.max(0.5, this.viewer.playbackSpeed - 0.25)),
                    'Period': () => this.viewer.changeSpeed(Math.min(2, this.viewer.playbackSpeed + 0.25))
                };

                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                        if (shortcuts[e.code]) {
                            e.preventDefault();
                            shortcuts[e.code]();
                        }
                    }
                });
            }

            addBookmark() {
                const bookmark = {
                    time: this.viewer.currentTime,
                    title: `Bookmark at ${this.viewer.formatTime(this.viewer.currentTime)}`,
                    note: ''
                };
                this.bookmarks.push(bookmark);
                this.renderBookmarks();
            }

            renderBookmarks() {
                // Add bookmarks panel if it doesn't exist
                let bookmarksPanel = document.querySelector('.bookmarks-panel');
                if (!bookmarksPanel) {
                    bookmarksPanel = document.createElement('div');
                    bookmarksPanel.className = 'sidebar-panel bookmarks-panel';
                    bookmarksPanel.innerHTML = `
                        <div class="panel-header">🔖 Bookmarks</div>
                        <div class="panel-content">
                            <div class="bookmarks-list" id="bookmarksList"></div>
                        </div>
                    `;
                    document.querySelector('.sidebar').appendChild(bookmarksPanel);
                }

                const bookmarksList = document.getElementById('bookmarksList');
                if (bookmarksList) {
                    bookmarksList.innerHTML = this.bookmarks.map((bookmark, index) => `
                        <div class="bookmark-item" onclick="viewer.jumpToTime(${bookmark.time})">
                            <div class="bookmark-time">${this.viewer.formatTime(bookmark.time)}</div>
                            <div class="bookmark-title">${bookmark.title}</div>
                            <button class="remove-bookmark" onclick="advancedFeatures.removeBookmark(${index}); event.stopPropagation();">×</button>
                        </div>
                    `).join('');
                }
            }

            removeBookmark(index) {
                this.bookmarks.splice(index, 1);
                this.renderBookmarks();
            }

            addNotesFeature() {
                // Add context menu for adding notes to segments
                document.addEventListener('contextmenu', (e) => {
                    const segment = e.target.closest('.transcript-segment');
                    if (segment) {
                        e.preventDefault();
                        this.showNotesModal(segment.dataset.time);
                    }
                });
            }

            showNotesModal(time) {
                const modal = document.createElement('div');
                modal.className = 'notes-modal';
                modal.innerHTML = `
                    <div class="modal-content">
                        <h3>Add Note for ${this.viewer.formatTime(time)}</h3>
                        <textarea class="note-input" placeholder="Enter your note...">${this.notes[time] || ''}</textarea>
                        <div class="modal-buttons">
                            <button class="save-note" onclick="advancedFeatures.saveNote('${time}', this.parentElement.previousElementSibling.value); this.parentElement.parentElement.parentElement.remove();">Save</button>
                            <button class="cancel-note" onclick="this.parentElement.parentElement.parentElement.remove();">Cancel</button>
                        </div>
                    </div>
                `;
                
                modal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.7);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 1000;
                `;
                
                modal.querySelector('.modal-content').style.cssText = `
                    background: white;
                    padding: 30px;
                    border-radius: 15px;
                    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
                    max-width: 500px;
                    width: 90%;
                `;
                
                document.body.appendChild(modal);
                modal.querySelector('.note-input').focus();
            }

            saveNote(time, note) {
                this.notes[time] = note;
                this.updateSegmentWithNote(time);
            }

            updateSegmentWithNote(time) {
                const segment = document.querySelector(`[data-time="${time}"]`);
                if (segment && this.notes[time]) {
                    segment.classList.add('has-note');
                    if (!segment.querySelector('.note-indicator')) {
                        const indicator = document.createElement('div');
                        indicator.className = 'note-indicator';
                        indicator.innerHTML = '📝';
                        indicator.title = this.notes[time];
                        segment.querySelector('.timestamp').appendChild(indicator);
                    }
                }
            }

            addAnalytics() {
                // Track segment views
                setInterval(() => {
                    if (this.viewer.isPlaying) {
                        const currentSegment = Math.floor(this.viewer.currentTime / 10); // 10-second segments
                        this.analytics.segmentViews[currentSegment] = (this.analytics.segmentViews[currentSegment] || 0) + 1;
                        this.analytics.totalListenTime += 0.1;
                    }
                }, 100);

                // Add analytics panel
                this.addAnalyticsPanel();
            }

            addAnalyticsPanel() {
                const analyticsPanel = document.createElement('div');
                analyticsPanel.className = 'sidebar-panel analytics-panel';
                analyticsPanel.innerHTML = `
                    <div class="panel-header">📈 Analytics</div>
                    <div class="panel-content">
                        <div class="analytics-stats">
                            <div class="analytic-item">
                                <span class="analytic-label">Listen Time:</span>
                                <span class="analytic-value" id="listenTime">0:00</span>
                            </div>
                            <div class="analytic-item">
                                <span class="analytic-label">Completion:</span>
                                <span class="analytic-value" id="completion">0%</span>
                            </div>
                        </div>
                        <canvas id="analyticsChart" width="300" height="150"></canvas>
                    </div>
                `;
                document.querySelector('.sidebar').appendChild(analyticsPanel);

                // Update analytics display
                setInterval(() => this.updateAnalyticsDisplay(), 1000);
            }

            updateAnalyticsDisplay() {
                const listenTimeEl = document.getElementById('listenTime');
                const completionEl = document.getElementById('completion');
                
                if (listenTimeEl) {
                    listenTimeEl.textContent = this.viewer.formatTime(this.analytics.totalListenTime);
                }
                
                if (completionEl) {
                    const completion = Math.round((this.viewer.currentTime / this.viewer.duration) * 100);
                    completionEl.textContent = `${completion}%`;
                }
            }

            addAccessibilityFeatures() {
                // Add ARIA labels and keyboard navigation
                document.querySelectorAll('.transcript-segment').forEach((segment, index) => {
                    segment.setAttribute('role', 'button');
                    segment.setAttribute('tabindex', '0');
                    segment.setAttribute('aria-label', `Segment ${index + 1}: ${segment.querySelector('.text').textContent}`);
                    
                    segment.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            segment.click();
                        }
                    });
                });

                // Add screen reader announcements
                this.addScreenReaderSupport();
            }

            addScreenReaderSupport() {
                const announcer = document.createElement('div');
                announcer.className = 'sr-only';
                announcer.setAttribute('aria-live', 'polite');
                announcer.style.cssText = `
                    position: absolute;
                    left: -10000px;
                    width: 1px;
                    height: 1px;
                    overflow: hidden;
                `;
                document.body.appendChild(announcer);

                // Announce current segment changes
                let lastAnnouncedSegment = -1;
                setInterval(() => {
                    const currentSegment = document.querySelector('.current-segment');
                    if (currentSegment) {
                        const segmentIndex = Array.from(document.querySelectorAll('.transcript-segment')).indexOf(currentSegment);
                        if (segmentIndex !== lastAnnouncedSegment) {
                            announcer.textContent = `Now playing: ${currentSegment.querySelector('.speaker').textContent} says ${currentSegment.querySelector('.text').textContent}`;
                            lastAnnouncedSegment = segmentIndex;
                        }
                    }
                }, 2000);
            }
        }

        // Theme Manager
        class ThemeManager {
            constructor() {
                this.currentTheme = 'default';
                this.themes = {
                    default: {
                        primary: '#4f46e5',
                        secondary: '#7c3aed',
                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
                    },
                    dark: {
                        primary: '#818cf8',
                        secondary: '#a78bfa',
                        background: 'linear-gradient(135deg, #1f2937 0%, #111827 100%)'
                    },
                    corporate: {
                        primary: '#2563eb',
                        secondary: '#1d4ed8',
                        background: 'linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%)'
                    }
                };
                
                this.addThemeSelector();
            }

            addThemeSelector() {
                const themePanel = document.createElement('div');
                themePanel.className = 'sidebar-panel theme-panel';
                themePanel.innerHTML = `
                    <div class="panel-header">🎨 Themes</div>
                    <div class="panel-content">
                        <div class="theme-options">
                            <button class="theme-btn active" onclick="themeManager.switchTheme('default')">Default</button>
                            <button class="theme-btn" onclick="themeManager.switchTheme('dark')">Dark</button>
                            <button class="theme-btn" onclick="themeManager.switchTheme('corporate')">Corporate</button>
                        </div>
                    </div>
                `;
                document.querySelector('.sidebar').appendChild(themePanel);
            }

            switchTheme(themeName) {
                this.currentTheme = themeName;
                const theme = this.themes[themeName];
                
                document.documentElement.style.setProperty('--primary-color', theme.primary);
                document.documentElement.style.setProperty('--secondary-color', theme.secondary);
                document.body.style.background = theme.background;
                
                // Update active theme button
                document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
            }
        }

        // Initialize the application
        let viewer, advancedFeatures, themeManager;
        
        document.addEventListener('DOMContentLoaded', () => {
            viewer = new PodcastTranscriptViewer();
            advancedFeatures = new AdvancedFeatures(viewer);
            themeManager = new ThemeManager();
        });

        // Add additional CSS for new features
        const additionalStyles = `

                padding: 10px;

                border-radius: 8px;
                margin-bottom: 8px;
                cursor: pointer;

                transition: all 0.3s ease;
            }

            .bookmark-item:hover {
                background: #f8fafc;
                border-color: #4f46e5;
            }

            .bookmark-time {
                font-family: 'Courier New', monospace;

                font-weight: 600;
                font-size: 0.9rem;
            }

            .bookmark-title {
                font-weight: 500;
                color: #374151;
                margin-top: 4px;
            }

            .remove-bookmark {
                position: absolute;
                top: 5px;
                right: 5px;
                width: 20px;
                height: 20px;
                border: none;
                background: #ef4444;
                color: white;
                border-radius: 50%;
                cursor: pointer;
                font-size: 12px;
                display: none;
            }

            .bookmark-item:hover .remove-bookmark {
                display: block;
            }

            .has-note {
                border-left-color: #f59e0b !important;
            }

            .note-indicator {
                margin-left: 8px;
                cursor: help;
            }

            .notes-modal .modal-content h3 {
                margin-bottom: 15px;
                color: #374151;
            }

            .note-input {
                width: 100%;
                height: 100px;
                padding: 10px;

                border-radius: 8px;

                margin-bottom: 15px;
            }

                display: flex;
                gap: 10px;
                justify-content: flex-end;
            }

            .save-note, .cancel-note {
                padding: 8px 16px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 600;
            }

            .save-note {
                background: #4f46e5;

            }

            .cancel-note {

                margin-bottom: 20px;

                font-weight: 500;
            }

                color: #4f46e5;
                font-weight: 600;
            }

                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }

            .theme-btn {
                flex: 1;
                padding: 8px 12px;

                border-radius: 6px;
                background: white;
                cursor: pointer;
                transition: all 0.3s ease;
                font-weight: 500;
            }

            .theme-btn.active {
                border-color: #4f46e5;
                background: #4f46e5;
                color: white;
            }

            .theme-btn:hover:not(.active) {
                border-color: #4f46e5;
                background: #f8fafc;
            }
        `;

        const styleSheet = document.createElement('style');
        styleSheet.textContent = additionalStyles;
        document.head.appendChild(styleSheet);
    </script>
