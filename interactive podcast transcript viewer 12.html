<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Podcast Transcript Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #2c3e50;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: slideInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            color: white;
            text-shadow: 2px 4px 8px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            flex-grow: 1;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .transcript-section {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .controls-panel {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .audio-player {
            width: 100%;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .audio-player audio {
            width: 100%;
            height: 50px;
            outline: none;
        }

        .search-container {
            position: relative;
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 2px solid rgba(102,126,234,0.2);
            border-radius: 12px;
            font-size: 16px;
            background: white;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102,126,234,0.3);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 18px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .control-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102,126,234,0.3);
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
        }

        .control-btn:active {
            transform: translateY(-1px);
        }

        .speed-control {
            margin-bottom: 25px;
        }

        .speed-control label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #2c3e50;
        }

        .speed-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            outline: none;
            cursor: pointer;
        }

        .stats-panel {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 16px;
            padding: 20px;
            color: white;
            margin-bottom: 25px;
        }

        .stats-panel h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .transcript-content {
            line-height: 1.8;
            font-size: 16px;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        .transcript-content::-webkit-scrollbar {
            width: 8px;
        }

        .transcript-content::-webkit-scrollbar-track {
            background: rgba(102,126,234,0.1);
            border-radius: 4px;
        }

        .transcript-content::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 4px;
        }

        .transcript-segment {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 4px solid transparent;
            position: relative;
            background: rgba(102,126,234,0.02);
        }

        .transcript-segment:hover {
            background: rgba(102,126,234,0.1);
            transform: translateX(5px);
            border-left-color: #667eea;
            box-shadow: 0 4px 15px rgba(102,126,234,0.1);
        }

        .transcript-segment.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: translateX(10px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.3);
            border-left-color: transparent;
        }

        .transcript-segment.highlighted {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            animation: pulse 2s infinite;
        }

        .timestamp {
            display: inline-block;
            background: rgba(102,126,234,0.15);
            color: #667eea;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 12px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .transcript-segment.active .timestamp {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .timestamp:hover {
            transform: scale(1.05);
            background: #667eea;
            color: white;
        }

        .speaker {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .transcript-segment.active .speaker {
            color: rgba(255,255,255,0.9);
        }

        .text {
            font-size: 16px;
            line-height: 1.6;
        }

        .search-highlight {
            background: linear-gradient(120deg, #f093fb, #f5576c);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .floating-controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .floating-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
            transition: all 0.3s ease;
        }

        .floating-btn:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 15px 35px rgba(102,126,234,0.5);
        }

        .mini-player {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            min-width: 300px;
            transform: translateY(120px);
            transition: transform 0.4s ease;
            z-index: 999;
        }

        .mini-player.visible {
            transform: translateY(0);
        }

        .mini-player-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mini-player-info {
            flex-grow: 1;
        }

        .mini-player-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: #2c3e50;
        }

        .mini-player-time {
            font-size: 12px;
            color: #667eea;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .controls-panel {
                position: relative;
                top: 0;
            }

            .header h1 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .transcript-section,
            .controls-panel {
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .controls-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Interactive Podcast Viewer</h1>
            <p>Professional transcript navigation with real-time synchronization</p>
        </div>

        <div class="main-content">
            <div class="transcript-section">
                <div class="audio-player">
                    <audio id="audioPlayer" controls>
                        <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.wav" type="audio/wav">
                        <p>Your browser doesn't support HTML5 audio. Please use a modern browser.</p>
                    </audio>
                </div>

                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search transcript..." autocomplete="off">
                </div>

                <div class="transcript-content" id="transcriptContent">
                    <!-- Transcript segments will be populated here -->
                </div>
            </div>

            <div class="controls-panel">
                <div class="stats-panel">
                    <h3>📊 Session Stats</h3>
                    <div class="stat-item">
                        <span>Total Duration:</span>
                        <span id="totalDuration">--:--</span>
                    </div>
                    <div class="stat-item">
                        <span>Current Time:</span>
                        <span id="currentTime">00:00</span>
                    </div>
                    <div class="stat-item">
                        <span>Words Found:</span>
                        <span id="searchResults">0</span>
                    </div>
                    <div class="stat-item">
                        <span>Segments:</span>
                        <span id="totalSegments">0</span>
                    </div>
                </div>

                <div class="controls-grid">
                    <button class="control-btn" id="jumpBackBtn">⏪ -10s</button>
                    <button class="control-btn" id="jumpForwardBtn">⏩ +10s</button>
                    <button class="control-btn" id="prevSegmentBtn">⬅️ Previous</button>
                    <button class="control-btn" id="nextSegmentBtn">➡️ Next</button>
                </div>

                <div class="speed-control">
                    <label for="speedSlider">Playback Speed: <span id="speedValue">1.0x</span></label>
                    <input type="range" id="speedSlider" class="speed-slider" min="0.5" max="2" step="0.1" value="1">
                </div>

                <div class="controls-grid">
                    <button class="control-btn" id="toggleAutoScrollBtn">🎯 Auto-scroll</button>
                    <button class="control-btn" id="exportBtn">📄 Export</button>
                    <button class="control-btn" id="fullscreenBtn">🖥️ Fullscreen</button>
                    <button class="control-btn" id="themeBtn">🌙 Dark Mode</button>
                </div>
            </div>
        </div>
    </div>

    <div class="floating-controls">
        <button class="floating-btn" id="scrollTopBtn" title="Scroll to Top">⬆️</button>
        <button class="floating-btn" id="miniPlayerToggle" title="Toggle Mini Player">📱</button>
    </div>

    <div class="mini-player" id="miniPlayer">
        <div class="mini-player-content">
            <div class="mini-player-info">
                <div class="mini-player-title">Interactive Podcast</div>
                <div class="mini-player-time" id="miniPlayerTime">00:00 / 00:00</div>
            </div>
            <button class="control-btn" style="padding: 8px 12px; font-size: 12px;" id="miniPlayerClose">✕</button>
        </div>
    </div>

    <script>
        class PodcastTranscriptViewer {
            constructor() {
                this.audioPlayer = document.getElementById('audioPlayer');
                this.transcriptContent = document.getElementById('transcriptContent');
                this.searchInput = document.getElementById('searchInput');
                this.currentSegmentIndex = 0;
                this.segments = [];
                this.autoScroll = true;
                this.searchResults = [];
                this.updateInterval = null;

                this.initializeData();
                this.setupEventListeners();
                this.startRealTimeUpdate();
            }

            initializeData() {
                // Sample podcast transcript data - in a real app, this would come from an API
                this.segments = [
                    {
                        startTime: 0,
                        endTime: 15,
                        speaker: "Host",
                        text: "Welcome to TechTalk Podcast! Today we're diving deep into the future of artificial intelligence and machine learning. I'm your host, Sarah Chen, and we have an incredible show lined up."
                    },
                    {
                        startTime: 15,
                        endTime: 35,
                        speaker: "Host",
                        text: "Joining us today is Dr. Michael Rodriguez, AI researcher at Stanford, and Lisa Park, CTO of InnovateTech. We'll be discussing the latest breakthroughs in neural networks and their practical applications."
                    },
                    {
                        startTime: 35,
                        endTime: 55,
                        speaker: "Dr. Rodriguez",
                        text: "Thanks for having me, Sarah. It's exciting to be here to talk about these revolutionary developments in AI. The field has progressed so rapidly in just the past few years."
                    },
                    {
                        startTime: 55,
                        endTime: 75,
                        speaker: "Lisa Park",
                        text: "Absolutely! At InnovateTech, we've seen firsthand how these AI advancements are transforming industries. From healthcare to finance, the applications are virtually limitless."
                    },
                    {
                        startTime: 75,
                        endTime: 100,
                        speaker: "Host",
                        text: "Let's start with the basics. Dr. Rodriguez, can you explain what makes current AI models so much more powerful than previous generations? What's changed in the underlying technology?"
                    },
                    {
                        startTime: 100,
                        endTime: 125,
                        speaker: "Dr. Rodriguez",
                        text: "The key breakthrough has been in transformer architectures and attention mechanisms. These allow models to understand context much better than before. We're also seeing improvements in training efficiency and data quality."
                    },
                    {
                        startTime: 125,
                        endTime: 150,
                        speaker: "Lisa Park",
                        text: "From a business perspective, what's really exciting is how accessible these technologies have become. Companies no longer need massive research teams to implement AI solutions. The democratization is remarkable."
                    },
                    {
                        startTime: 150,
                        endTime: 170,
                        speaker: "Host",
                        text: "That's a great point about accessibility. But what about the challenges? Are there concerns we should be aware of as AI becomes more prevalent in our daily lives?"
                    },
                    {
                        startTime: 170,
                        endTime: 195,
                        speaker: "Dr. Rodriguez",
                        text: "Definitely. We need to address issues like bias in training data, model interpretability, and ensuring AI systems are robust and safe. These aren't just technical challenges, but ethical ones too."
                    },
                    {
                        startTime: 195,
                        endTime: 220,
                        speaker: "Lisa Park",
                        text: "Security is another major concern. As AI systems become more integrated into critical infrastructure, we need to ensure they're protected against adversarial attacks and maintain user privacy."
                    }
                ];

                this.renderTranscript();
                this.updateStats();
            }

            renderTranscript() {
                this.transcriptContent.innerHTML = this.segments.map((segment, index) => `
                    <div class="transcript-segment" data-index="${index}" data-start="${segment.startTime}">
                        <div class="timestamp" data-time="${segment.startTime}">
                            ${this.formatTime(segment.startTime)}
                        </div>
                        <div class="speaker">${segment.speaker}</div>
                        <div class="text">${segment.text}</div>
                    </div>
                `).join('');

                // Add click listeners to segments and timestamps
                this.transcriptContent.addEventListener('click', (e) => {
                    const segment = e.target.closest('.transcript-segment');
                    const timestamp = e.target.closest('.timestamp');
                    
                    if (timestamp) {
                        const time = parseFloat(timestamp.dataset.time);
                        this.jumpToTime(time);
                    } else if (segment) {
                        const time = parseFloat(segment.dataset.start);
                        this.jumpToTime(time);
                    }
                });
            }

            setupEventListeners() {
                // Audio player events
                this.audioPlayer.addEventListener('timeupdate', () => this.handleTimeUpdate());
                this.audioPlayer.addEventListener('loadedmetadata', () => this.updateDuration());
                this.audioPlayer.addEventListener('play', () => this.showMiniPlayer());
                this.audioPlayer.addEventListener('pause', () => this.hideMiniPlayer());

                // Search functionality
                this.searchInput.addEventListener('input', (e) => this.handleSearch(e.target.value));

                // Control buttons
                document.getElementById('jumpBackBtn').addEventListener('click', () => this.jumpTime(-10));
                document.getElementById('jumpForwardBtn').addEventListener('click', () => this.jumpTime(10));
                document.getElementById('prevSegmentBtn').addEventListener('click', () => this.navigateSegment(-1));
                document.getElementById('nextSegmentBtn').addEventListener('click', () => this.navigateSegment(1));
                
                // Speed control
                const speedSlider = document.getElementById('speedSlider');
                speedSlider.addEventListener('input', (e) => {
                    this.audioPlayer.playbackRate = e.target.value;
                    document.getElementById('speedValue').textContent = e.target.value + 'x';
                });

                // Additional controls
                document.getElementById('toggleAutoScrollBtn').addEventListener('click', () => this.toggleAutoScroll());
                document.getElementById('exportBtn').addEventListener('click', () => this.exportTranscript());
                document.getElementById('fullscreenBtn').addEventListener('click', () => this.toggleFullscreen());
                document.getElementById('themeBtn').addEventListener('click', () => this.toggleTheme());

                // Floating controls
                document.getElementById('scrollTopBtn').addEventListener('click', () => {
                    this.transcriptContent.scrollTo({ top: 0, behavior: 'smooth' });
                });
                
                document.getElementById('miniPlayerToggle').addEventListener('click', () => this.toggleMiniPlayer());
                document.getElementById('miniPlayerClose').addEventListener('click', () => this.hideMiniPlayer());

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => this.handleKeyboard(e));
            }

            handleTimeUpdate() {
                const currentTime = this.audioPlayer.currentTime;
                document.getElementById('currentTime').textContent = this.formatTime(currentTime);
                document.getElementById('miniPlayerTime').textContent = 
                    `${this.formatTime(currentTime)} / ${this.formatTime(this.audioPlayer.duration || 0)}`;

                // Find current segment
                const newSegmentIndex = this.segments.findIndex((segment, index) => {
                    const nextSegment = this.segments[index + 1];
                    return currentTime >= segment.startTime && 
                           (!nextSegment || currentTime < nextSegment.startTime);
                });

                if (newSegmentIndex !== -1 && newSegmentIndex !== this.currentSegmentIndex) {
                    this.updateActiveSegment(newSegmentIndex);
                }
            }

            updateActiveSegment(index) {
                // Remove previous active segment
                const previousActive = document.querySelector('.transcript-segment.active');
                if (previousActive) {
                    previousActive.classList.remove('active');
                }

                // Add active class to current segment
                const segments = document.querySelectorAll('.transcript-segment');
                if (segments[index]) {
                    segments[index].classList.add('active');
                    
                    // Auto-scroll to active segment
                    if (this.autoScroll) {
                        segments[index].scrollIntoView({
                            behavior: 'smooth',
                            block: 'center'
                        });
                    }
                }

                this.currentSegmentIndex = index;
            }

            handleSearch(query) {
                const segments = document.querySelectorAll('.transcript-segment');
                this.searchResults = [];
                
                segments.forEach((segment, index) => {
                    const text = segment.querySelector('.text');
                    const originalText = this.segments[index].text;
                    
                    if (query.trim() === '') {
                        text.innerHTML = originalText;
                        segment.classList.remove('highlighted');
                    } else {
                        const regex = new RegExp(`(${query})`, 'gi');
                        if (originalText.match(regex)) {
                            this.searchResults.push(index);
                            text.innerHTML = originalText.replace(regex, '<span class="search-highlight">$1</span>');
                            segment.classList.add('highlighted');
                        } else {
                            text.innerHTML = originalText;
                            segment.classList.remove('highlighted');
                        }
                    }
                });

                document.getElementById('searchResults').textContent = this.searchResults.length;
            }

            jumpToTime(time) {
                this.audioPlayer.currentTime = Math.max(0, Math.min(time, this.audioPlayer.duration));
            }

            jumpTime(seconds) {
                this.jumpToTime(this.audioPlayer.currentTime + seconds);
            }

            navigateSegment(direction) {
                const newIndex = Math.max(0, Math.min(this.currentSegmentIndex + direction, this.segments.length - 1));
                this.jumpToTime(this.segments[newIndex].startTime);
            }

            toggleAutoScroll() {
                this.autoScroll = !this.autoScroll;
                const btn = document.getElementById('toggleAutoScrollBtn');
                btn.textContent = this.autoScroll ? '🎯 Auto-scroll' : '⏸️ Manual';
                btn.style.opacity = this.autoScroll ? '1' : '0.7';
            }

            exportTranscript() {
                const content = this.segments.map(segment => 
                    `[${this.formatTime(segment.startTime)}] ${segment.speaker}: ${segment.text}`
                ).join('\n\n');

                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'podcast-transcript.txt';
                a.click();
                URL.revokeObjectURL(url);
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }

            toggleTheme() {
                document.body.classList.toggle('dark-theme');
                const btn = document.getElementById('themeBtn');
                btn.textContent = document.body.classList.contains('dark-theme') ? '☀️ Light Mode' : '🌙 Dark Mode';
            }

            showMiniPlayer() {
                document.getElementById('miniPlayer').classList.add('visible');
            }

            hideMiniPlayer() {
                document.getElementById('miniPlayer').classList.remove('visible');
            }

            toggleMiniPlayer() {
                const miniPlayer = document.getElementById('miniPlayer');
                miniPlayer.classList.toggle('visible');
            }

            handleKeyboard(e) {
                if (e.target.tagName === 'INPUT') return;

                switch(e.code) {
                    case 'Space':
                        e.preventDefault();
                        this.audioPlayer.paused ? this.audioPlayer.play() : this.audioPlayer.pause();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        this.jumpTime(-5);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        this.jumpTime(5);
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        this.navigateSegment(-1);
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        this.navigateSegment(1);
                        break;
                }
            }

            startRealTimeUpdate() {
                this.updateInterval = setInterval(() => {
                    if (!this.audioPlayer.paused) {
                        // Add subtle animations and updates
                        this.updateVisualEffects();
                    }
                }, 100);
            }

            updateVisualEffects() {
                const activeSegment = document.querySelector('.transcript-segment.active');
                if (activeSegment) {
                    const progress = (this.audioPlayer.currentTime - this.segments[this.currentSegmentIndex].startTime) /
                                   (this.segments[this.currentSegmentIndex].endTime - this.segments[this.currentSegmentIndex].startTime);
                    
                    // Add visual progress indicator
                    activeSegment.style.background = `linear-gradient(90deg, 
                        rgba(102,126,234,1) 0%, 
                        rgba(118,75,162,1) ${progress * 100}%, 
                        rgba(102,126,234,0.8) ${progress * 100}%, 
                        rgba(118,75,162,0.8) 100%)`;
                }
            }

            updateStats() {
                document.getElementById('totalSegments').textContent = this.segments.length;
            }

            updateDuration() {
                const duration = this.audioPlayer.duration;
                if (duration) {
                    document.getElementById('totalDuration').textContent = this.formatTime(duration);
                }
            }

            formatTime(seconds) {
                if (isNaN(seconds) || seconds < 0) return '00:00';
                
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = Math.floor(seconds % 60);
                return `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
            }

            // Advanced feature: Waveform visualization
            generateWaveform() {
                const canvas = document.createElement('canvas');
                canvas.width = 800;
                canvas.height = 100;
                canvas.style.width = '100%';
                canvas.style.height = '60px';
                canvas.style.borderRadius = '8px';
                canvas.style.background = 'linear-gradient(90deg, #667eea, #764ba2)';
                
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
                gradient.addColorStop(0, '#667eea');
                gradient.addColorStop(1, '#764ba2');
                
                // Simulate waveform data
                ctx.fillStyle = gradient;
                for (let i = 0; i < canvas.width; i += 2) {
                    const height = Math.random() * canvas.height * 0.8 + 10;
                    ctx.fillRect(i, (canvas.height - height) / 2, 1, height);
                }
                
                return canvas;
            }

            // Advanced feature: Bookmarking system
            addBookmark() {
                const currentTime = this.audioPlayer.currentTime;
                const timestamp = this.formatTime(currentTime);
                const bookmarkData = {
                    time: currentTime,
                    timestamp: timestamp,
                    note: prompt(`Add a note for bookmark at ${timestamp}:`) || 'Bookmark'
                };

                if (!this.bookmarks) this.bookmarks = [];
                this.bookmarks.push(bookmarkData);
                this.renderBookmarks();
            }

            renderBookmarks() {
                if (!this.bookmarks || this.bookmarks.length === 0) return;

                let bookmarksPanel = document.getElementById('bookmarksPanel');
                if (!bookmarksPanel) {
                    bookmarksPanel = document.createElement('div');
                    bookmarksPanel.id = 'bookmarksPanel';
                    bookmarksPanel.className = 'stats-panel';
                    bookmarksPanel.innerHTML = '<h3>📚 Bookmarks</h3>';
                    document.querySelector('.controls-panel').appendChild(bookmarksPanel);
                }

                const bookmarksList = this.bookmarks.map((bookmark, index) => `
                    <div class="bookmark-item" style="margin-bottom: 10px; padding: 8px; background: rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer;" onclick="viewer.jumpToTime(${bookmark.time})">
                        <div style="font-weight: 600;">${bookmark.timestamp}</div>
                        <div style="font-size: 0.9rem; opacity: 0.9;">${bookmark.note}</div>
                    </div>
                `).join('');

                bookmarksPanel.innerHTML = '<h3>📚 Bookmarks</h3>' + bookmarksList;
            }

            // Advanced feature: Transcript analytics
            analyzeTranscript() {
                const wordCount = this.segments.reduce((total, segment) => {
                    return total + segment.text.split(' ').length;
                }, 0);

                const speakers = [...new Set(this.segments.map(s => s.speaker))];
                const speakerStats = speakers.map(speaker => {
                    const speakerSegments = this.segments.filter(s => s.speaker === speaker);
                    const speakerWordCount = speakerSegments.reduce((total, segment) => {
                        return total + segment.text.split(' ').length;
                    }, 0);
                    const speakerTime = speakerSegments.reduce((total, segment) => {
                        return total + (segment.endTime - segment.startTime);
                    }, 0);

                    return {
                        name: speaker,
                        wordCount: speakerWordCount,
                        talkTime: speakerTime,
                        percentage: Math.round((speakerWordCount / wordCount) * 100)
                    };
                });

                return {
                    totalWords: wordCount,
                    totalDuration: this.segments[this.segments.length - 1].endTime,
                    speakerStats: speakerStats,
                    averageWordsPerMinute: Math.round(wordCount / (this.segments[this.segments.length - 1].endTime / 60))
                };
            }

            showAnalytics() {
                const analytics = this.analyzeTranscript();
                const modal = document.createElement('div');
                modal.className = 'analytics-modal';
                modal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0,0,0,0.8);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 10000;
                `;

                const content = `
                    <div style="background: white; padding: 30px; border-radius: 16px; max-width: 600px; width: 90%;">
                        <h2 style="margin-bottom: 20px; color: #2c3e50;">📊 Transcript Analytics</h2>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                            <div style="text-align: center; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                                <div style="font-size: 2rem; font-weight: bold; color: #667eea;">${analytics.totalWords}</div>
                                <div>Total Words</div>
                            </div>
                            <div style="text-align: center; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                                <div style="font-size: 2rem; font-weight: bold; color: #667eea;">${analytics.averageWordsPerMinute}</div>
                                <div>Words per Minute</div>
                            </div>
                        </div>

                        <h3 style="margin-bottom: 15px;">Speaker Breakdown:</h3>
                        ${analytics.speakerStats.map(speaker => `
                            <div style="margin-bottom: 10px; padding: 10px; background: #f8f9fa; border-radius: 8px;">
                                <div style="font-weight: 600;">${speaker.name}</div>
                                <div style="font-size: 0.9rem; color: #666;">
                                    ${speaker.wordCount} words (${speaker.percentage}%) • 
                                    ${this.formatTime(speaker.talkTime)} speaking time
                                </div>
                            </div>
                        `).join('')}

                        <button onclick="this.parentElement.parentElement.remove()" style="
                            margin-top: 20px;
                            padding: 10px 20px;
                            background: linear-gradient(135deg, #667eea, #764ba2);
                            color: white;
                            border: none;
                            border-radius: 8px;
                            cursor: pointer;
                            font-weight: 600;
                        ">Close</button>
                    </div>
                `;

                modal.innerHTML = content;
                document.body.appendChild(modal);

                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.remove();
                    }
                });
            }

            // Advanced feature: Note-taking system
            initializeNotes() {
                const notesBtn = document.createElement('button');
                notesBtn.className = 'control-btn';
                notesBtn.innerHTML = '📝 Notes';
                notesBtn.addEventListener('click', () => this.toggleNotesPanel());
                
                const controlsGrid = document.querySelector('.controls-grid');
                controlsGrid.appendChild(notesBtn);
            }

            toggleNotesPanel() {
                let notesPanel = document.getElementById('notesPanel');
                
                if (!notesPanel) {
                    notesPanel = document.createElement('div');
                    notesPanel.id = 'notesPanel';
                    notesPanel.style.cssText = `
                        position: fixed;
                        right: 20px;
                        top: 50%;
                        transform: translateY(-50%);
                        width: 300px;
                        background: rgba(255,255,255,0.95);
                        backdrop-filter: blur(20px);
                        border-radius: 16px;
                        padding: 20px;
                        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
                        z-index: 1000;
                        display: none;
                    `;
                    
                    notesPanel.innerHTML = `
                        <h3 style="margin-bottom: 15px;">📝 Session Notes</h3>
                        <textarea id="notesTextarea" style="
                            width: 100%;
                            height: 200px;
                            border: 1px solid #ddd;
                            border-radius: 8px;
                            padding: 10px;
                            font-family: inherit;
                            resize: vertical;
                        " placeholder="Take notes while listening..."></textarea>
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <button onclick="viewer.addTimestampedNote()" style="
                                flex: 1;
                                padding: 8px;
                                background: #667eea;
                                color: white;
                                border: none;
                                border-radius: 6px;
                                cursor: pointer;
                            ">+ Timestamp</button>
                            <button onclick="viewer.saveNotes()" style="
                                flex: 1;
                                padding: 8px;
                                background: #28a745;
                                color: white;
                                border: none;
                                border-radius: 6px;
                                cursor: pointer;
                            ">Save</button>
                        </div>
                    `;
                    
                    document.body.appendChild(notesPanel);
                }
                
                notesPanel.style.display = notesPanel.style.display === 'none' ? 'block' : 'none';
            }

            addTimestampedNote() {
                const textarea = document.getElementById('notesTextarea');
                const currentTime = this.formatTime(this.audioPlayer.currentTime);
                const timestampNote = `\n[${currentTime}] `;
                
                textarea.value += timestampNote;
                textarea.focus();
                textarea.setSelectionRange(textarea.value.length, textarea.value.length);
            }

            saveNotes() {
                const notes = document.getElementById('notesTextarea').value;
                if (!notes.trim()) return;
                
                const blob = new Blob([notes], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `podcast-notes-${new Date().toISOString().split('T')[0]}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            }
        }

        // Initialize the application
        let viewer;
        document.addEventListener('DOMContentLoaded', () => {
            viewer = new PodcastTranscriptViewer();
            
            // Add additional features
            viewer.initializeNotes();
            
            // Add analytics button
            const analyticsBtn = document.createElement('button');
            analyticsBtn.className = 'control-btn';
            analyticsBtn.innerHTML = '📈 Analytics';
            analyticsBtn.addEventListener('click', () => viewer.showAnalytics());
            document.querySelector('.controls-grid').appendChild(analyticsBtn);
            
            // Add bookmark button
            const bookmarkBtn = document.createElement('button');
            bookmarkBtn.className = 'control-btn';
            bookmarkBtn.innerHTML = '🔖 Bookmark';
            bookmarkBtn.addEventListener('click', () => viewer.addBookmark());
            document.querySelector('.controls-grid').appendChild(bookmarkBtn);

            // Add waveform visualization
            const waveform = viewer.generateWaveform();
            const audioPlayer = document.querySelector('.audio-player');
            audioPlayer.appendChild(waveform);

            // Add progress bar
            const progressContainer = document.createElement('div');
            progressContainer.style.cssText = `
                position: relative;
                height: 4px;
                background: rgba(102,126,234,0.2);
                border-radius: 2px;
                margin: 10px 0;
                cursor: pointer;
            `;
            
            const progressBar = document.createElement('div');
            progressBar.id = 'progressBar';
            progressBar.style.cssText = `
                height: 100%;
                background: linear-gradient(90deg, #667eea, #764ba2);
                border-radius: 2px;
                width: 0%;
                transition: width 0.1s ease;
            `;
            
            progressContainer.appendChild(progressBar);
            audioPlayer.appendChild(progressContainer);

            // Progress bar click handler
            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const percentage = (e.clientX - rect.left) / rect.width;
                const duration = viewer.audioPlayer.duration;
                if (duration) {
                    viewer.jumpToTime(duration * percentage);
                }
            });

            // Update progress bar
            viewer.audioPlayer.addEventListener('timeupdate', () => {
                const duration = viewer.audioPlayer.duration;
                if (duration) {
                    const percentage = (viewer.audioPlayer.currentTime / duration) * 100;
                    progressBar.style.width = percentage + '%';
                }
            });

            // Add keyboard shortcuts help
            const helpBtn = document.createElement('button');
            helpBtn.className = 'control-btn';
            helpBtn.innerHTML = '❓ Help';
            helpBtn.addEventListener('click', () => {
                const helpModal = document.createElement('div');
                helpModal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0,0,0,0.8);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 10000;
                `;
                
                helpModal.innerHTML = `
                    <div style="background: white; padding: 30px; border-radius: 16px; max-width: 500px; width: 90%;">
                        <h2 style="margin-bottom: 20px; color: #2c3e50;">⌨️ Keyboard Shortcuts</h2>
                        
                        <div style="display: grid; gap: 10px; font-family: monospace;">
                            <div><strong>Space</strong> - Play/Pause</div>
                            <div><strong>← →</strong> - Jump 5 seconds</div>
                            <div><strong>↑ ↓</strong> - Navigate segments</div>
                            <div><strong>Ctrl+F</strong> - Focus search</div>
                        </div>

                        <h3 style="margin: 20px 0 10px 0;">🎛️ Features</h3>
                        <ul style="margin-left: 20px; line-height: 1.6;">
                            <li>Real-time transcript synchronization</li>
                            <li>Advanced search with highlighting</li>
                            <li>Speed control and bookmarking</li>
                            <li>Analytics and note-taking</li>
                            <li>Export functionality</li>
                            <li>Mini player mode</li>
                        </ul>

                        <button onclick="this.parentElement.parentElement.remove()" style="
                            margin-top: 20px;
                            padding: 10px 20px;
                            background: linear-gradient(135deg, #667eea, #764ba2);
                            color: white;
                            border: none;
                            border-radius: 8px;
                            cursor: pointer;
                            font-weight: 600;
                        ">Close</button>
                    </div>
                `;
                
                document.body.appendChild(helpModal);
                helpModal.addEventListener('click', (e) => {
                    if (e.target === helpModal) helpModal.remove();
                });
            });
            
            document.querySelector('.controls-grid').appendChild(helpBtn);

            console.log('🎉 Interactive Podcast Transcript Viewer loaded successfully!');
            console.log('Features: Real-time sync, search, analytics, bookmarks, notes, and more!');
        });
    </script>
</body>
</html>
